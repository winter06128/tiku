</head>

        { id:9, type:'essay', category:'model', catLabel:'回归建模', tagClass:'tag-model',

        { id:10, type:'choice', category:'model', catLabel:'回归建模', tagClass:'tag-choice',

          options:[{text:'固定效应模型',correct:false},{text:'随机效应+探索异质性来源',correct:true},{text:'直接合并',correct:false},{text:'只选阳性结果',correct:false}],

    let currentUser=null,solvedMap={},wrongIds=[],currentPage='home',currentCategory=null,currentList=[...questions],currentIdx=0;
    let toastTimer=null;

    async function register(){
        const e=document.getElementById('auth-email').value.trim(),p=document.getElementById('auth-password').value.trim();
        if(!e||!p)return showAuthError('请填写邮箱和密码');
        if(p.length<6)return showAuthError('密码至少6位');
        try{const{data,error}=await sb.auth.signUp({email:e,password:p});if(error)throw error;if(data.user){currentUser=data.user;onLoginSuccess()}else showAuthError('注册成功，请登录')}catch(err){showAuthError(err.message)}
    }
    async function login(){
        const e=document.getElementById('auth-email').value.trim(),p=document.getElementById('auth-password').value.trim();
        if(!e||!p)return showAuthError('请填写邮箱和密码');
        try{const{data,error}=await sb.auth.signInWithPassword({email:e,password:p});if(error)throw error;currentUser=data.user;onLoginSuccess()}catch(err){showAuthError('邮箱或密码错误')}
    }
    async function logout(){clearTimeout(toastTimer);solvedMap={};wrongIds=[];questions.forEach(q=>{delete q._userInput;delete q._selectedIdx});currentIdx=0;currentCategory=null;currentList=[...questions];currentUser=null;await sb.auth.signOut();document.getElementById('app-main').style.display='none';document.getElementById('auth-overlay').style.display='flex';document.getElementById('auth-email').value='';document.getElementById('auth-password').value=''}
    function showAuthError(m){const el=document.getElementById('auth-error');el.textContent=m;el.style.display='block';setTimeout(()=>el.style.display='none',5000)}
    async function onLoginSuccess(){clearTimeout(toastTimer);solvedMap={};wrongIds=[];questions.forEach(q=>{delete q._userInput;delete q._selectedIdx});currentIdx=0;currentCategory=null;currentList=[...questions];document.getElementById('auth-overlay').style.display='none';document.getElementById('app-main').style.display='block';await loadUserData();updateHome();updateBadge();navigateTo('home')}
    async function loadUserData(){try{const{data}=await sb.from('user_data').select('*').eq('user_id',currentUser.id).single();if(data){solvedMap=data.solved||{};wrongIds=data.wrong_ids||[];const ei=data.essay_inputs||{};questions.forEach(q=>{if(ei[String(q.id)])q._userInput=ei[String(q.id)];else delete q._userInput})}}catch(e){}}
    async function saveUserData(){if(!currentUser)return;const ei={};questions.forEach(q=>{if(q._userInput)ei[String(q.id)]=q._userInput});const r={user_id:currentUser.id,solved:solvedMap,wrong_ids:wrongIds,essay_inputs:ei,updated_at:new Date()};const{data:ex}=await sb.from('user_data').select('id').eq('user_id',currentUser.id).single();if(ex)await sb.from('user_data').update(r).eq('user_id',currentUser.id);else await sb.from('user_data').insert(r)}
    function updateBadge(){const c=wrongIds.length;document.getElementById('navWrongBadge').style.display=c?'inline':'none';document.getElementById('navWrongBadge').textContent=c}
    function showToast(m){
        const t=document.getElementById('toast');
        t.textContent=m;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer=setTimeout(()=>{t.classList.remove('show')},2000);
    }
    function navigateTo(p){currentPage=p;document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById('page-'+p).classList.add('active');document.querySelectorAll('.nav-links a').forEach(a=>{a.classList.remove('active');if(a.dataset.page===p)a.classList.add('active')});if(p==='quiz'){if(!currentCategory)setCategory(null);renderQuiz()}if(p==='wrongbook')renderWrongBook();if(p==='home')updateHome()}
    function setCategory(c){if(c){currentCategory=c;currentList=questions.filter(q=>q.category===c);document.getElementById('clearCategoryBtn').style.display='inline-flex'}else{currentCategory=null;currentList=[...questions];document.getElementById('clearCategoryBtn').style.display='none'}currentIdx=0}
    function clearCategoryFilter(){setCategory(null);renderQuiz()}
    function startQuiz(){setCategory(null);renderQuiz();navigateTo('quiz')}
    function filterByCategory(k){navigateTo('quiz');setCategory(k);renderQuiz()}
    function updateHome(){const t=questions.length,c=Object.keys(solvedMap).length;document.getElementById('homeTotalQ').textContent=t;document.getElementById('homeProgress').textContent=t?Math.round(c/t*100)+'%':'0%';document.getElementById('homeCorrect').textContent=Object.values(solvedMap).filter(v=>v==='correct').length;document.getElementById('homeWrong').textContent=wrongIds.length;updateBadge();renderCats()}
    function renderCats(){const cats=[{key:'design',label:'科研设计',icon:'💊',ic:'blue',desc:'RCT/诊断/样本量'},{key:'observe',label:'观察性研究',icon:'👥',ic:'green',desc:'队列/病例对照'},{key:'mean',label:'均值比较',icon:'📏',ic:'amber',desc:'t/方差/秩和'},{key:'assoc',label:'关联分析',icon:'🔢',ic:'rose',desc:'卡方/相关'},{key:'model',label:'回归建模',icon:'📐',ic:'purple',desc:'线性/Logistic'},{key:'surv',label:'预后生存',icon:'⏳',ic:'teal',desc:'KM/Cox'},{key:'diagmod',label:'诊断评价',icon:'🔬',ic:'indigo',desc:'ROC/敏感性'},{key:'evid',label:'证据综合',icon:'🧩',ic:'cyan',desc:'Meta/异质性'}];document.getElementById('categoryGrid').innerHTML=cats.map(c=>{const cnt=questions.filter(q=>q.category===c.key).length;return`<div class="category-card" onclick="filterByCategory('${c.key}')"><div class="cat-icon ${c.ic}">${c.icon}</div><span class="cat-count">${cnt}题</span><h3>${c.label}</h3><p>${c.desc}</p></div>`}).join('')}
    function renderQuiz(){if(!currentList.length)return;if(currentIdx<0||currentIdx>=currentList.length)currentIdx=0;const q=currentList[currentIdx];if(q.type==='essay')renderEssay(q);else renderChoice(q);renderNav()}
    function renderEssay(q){const s=solvedMap[String(q.id)],bc=s==='correct'?'solved-correct':(s==='wrong'?'solved-wrong':'');document.getElementById('quizMain').innerHTML=`<div class="question-card ${bc}"><div class="question-meta"><span>第${currentIdx+1}/${currentList.length}题</span><span class="question-tag ${q.tagClass}">${q.catLabel}·简答</span>${s==='correct'?'<span style="color:#10b981">✅已掌握</span>':''}${s==='wrong'?'<span style="color:#ef4444">❌待复习</span>':''}</div><h2>${q.title}</h2><div class="question-scenario"><strong>📋场景：</strong>${q.scenario}</div><div style="font-size:0.85rem;margin-bottom:8px">📖${q.journal} · 难度${q.difficulty}</div><div style="background:#f0f9ff;padding:10px;border-radius:8px;margin-bottom:12px">💊${q.drugKnowledge}</div><ol class="sub-questions">${q.subQuestions.map(sq=>`<li>${sq}</li>`).join('')}</ol><textarea class="essay-input" id="essayInput" placeholder="输入你的答案...">${q._userInput||''}</textarea><div style="margin-top:10px;display:flex;gap:10px"><button class="btn btn-primary btn-sm" onclick="submitEssay(${q.id})">📤提交答案</button><button class="btn btn-sm" id="essayReset" onclick="resetEssay()" style="display:none;background:#f1f5f9">↩重新输入</button></div><div id="essayFeedback" style="margin-top:12px">${s?feedbackHTML(q):''}</div><div style="margin-top:12px;display:flex;gap:8px"><button class="btn btn-sm" onclick="prevQ()" ${currentIdx===0?'disabled':''}>⬅上一题</button><button class="btn btn-sm" onclick="nextQ()" ${currentIdx===currentList.length-1?'disabled':''}>下一题➡</button></div></div>`;if(s){document.getElementById('essayInput').disabled=true;document.getElementById('essayReset').style.display='inline-flex'}}
    function feedbackHTML(q){const s=solvedMap[String(q.id)];return`<div style="margin-top:12px;padding-top:12px;border-top:2px dashed var(--border)">${q.answers.map((a,i)=>`<div class="answer-block">📝(${String.fromCharCode(97+i)})${a}</div>`).join('')}<div style="background:#fffbe6;padding:10px;border-radius:8px;margin-top:8px"><strong>🔑要点：</strong>${q.keyPoints}</div><div style="margin-top:8px;display:flex;gap:8px"><button class="btn btn-success btn-sm" onclick="markEssay(${q.id},'correct')" ${s==='correct'?'disabled':''}>✅答对了</button><button class="btn btn-danger btn-sm" onclick="markEssay(${q.id},'wrong')" ${s==='wrong'?'disabled':''}>❌答错了</button></div></div>`}
    function submitEssay(id){const q=questions.find(q=>q.id===id);q._userInput=document.getElementById('essayInput').value;document.getElementById('essayFeedback').innerHTML=feedbackHTML(q);document.getElementById('essayInput').disabled=true;document.getElementById('essayReset').style.display='inline-flex';saveUserData()}
    function resetEssay(){document.getElementById('essayInput').disabled=false;document.getElementById('essayInput').value='';document.getElementById('essayFeedback').innerHTML='';document.getElementById('essayReset').style.display='none';delete currentList[currentIdx]._userInput;saveUserData()}
    function markEssay(id,s){solvedMap[String(id)]=s;solvedMap=Object.assign({},solvedMap);if(s==='wrong')addWrong(id);else removeWrong(id);saveUserData();renderQuiz();updateHome();showToast(s==='correct'?'已掌握！':'已加入错题本')}
    function renderChoice(q){const s=solvedMap[String(q.id)],bc=s==='correct'?'solved-correct':(s==='wrong'?'solved-wrong':'');document.getElementById('quizMain').innerHTML=`<div class="question-card ${bc}"><div class="question-meta"><span>第${currentIdx+1}/${currentList.length}题</span><span class="question-tag ${q.tagClass}">${q.catLabel}·选择</span>${s==='correct'?'<span style="color:#10b981">✅正确</span>':''}${s==='wrong'?'<span style="color:#ef4444">❌错误</span>':''}</div><h2>${q.title}</h2><div class="question-scenario">${q.scenario}</div><div style="font-size:0.85rem;margin-bottom:8px">📖${q.journal} · 难度${q.difficulty}</div><div style="background:#f0f9ff;padding:10px;border-radius:8px;margin-bottom:12px">💊${q.drugKnowledge}</div><div class="options-list">${q.options.map((o,i)=>{let cls=s?(o.correct?'correct-highlight':''):'';if(s&&q._selectedIdx===i)cls+=o.correct?' selected-correct':' selected-wrong';return`<div class="option-item ${cls} ${s?'disabled':''}" onclick="selectOption(${q.id},${i})">${String.fromCharCode(65+i)}. ${o.text}</div>`}).join('')}</div>${s?`<div style="margin-top:10px;background:#f8fafc;padding:10px;border-radius:8px">💡解析：${q.explanation}</div>`:''}<div style="margin-top:12px;display:flex;gap:8px"><button class="btn btn-sm" onclick="prevQ()" ${currentIdx===0?'disabled':''}>⬅上一题</button><button class="btn btn-sm" onclick="nextQ()" ${currentIdx===currentList.length-1?'disabled':''}>下一题➡</button></div></div>`}
    function selectOption(qId,i){const q=questions.find(q=>q.id===qId);if(!q||solvedMap[String(qId)])return;q._selectedIdx=i;const correct=q.options[i].correct;solvedMap[String(qId)]=correct?'correct':'wrong';solvedMap=Object.assign({},solvedMap);if(!correct)addWrong(qId);else removeWrong(qId);saveUserData();renderQuiz();updateHome();showToast(correct?'正确！✅':'错误，已加入错题本❌')}
    function prevQ(){if(currentIdx>0){currentIdx--;renderQuiz()}}
    function nextQ(){if(currentIdx<currentList.length-1){currentIdx++;renderQuiz()}}
    function addWrong(id){if(!wrongIds.includes(id)){wrongIds.push(id);updateBadge()}}
    function removeWrong(id){wrongIds=wrongIds.filter(x=>x!==id);updateBadge()}
    function renderNav(){document.getElementById('questionNavGrid').innerHTML=currentList.map((q,i)=>{let cls='';if(i===currentIdx)cls='current';else if(solvedMap[String(q.id)]==='correct')cls='correct-dot';else if(solvedMap[String(q.id)]==='wrong')cls='wrong-dot';return`<div class="q-nav-dot ${cls}" onclick="jumpToQ(${i})">${i+1}</div>`}).join('')}
    function jumpToQ(i){currentIdx=i;renderQuiz()}
    function renderWrongBook(){const l=document.getElementById('wrongList');if(!wrongIds.length){l.innerHTML='<div class="empty-state"><div style="font-size:3rem">🏆</div><h3>错题本为空</h3></div>';return}l.innerHTML=wrongIds.map(id=>{const q=questions.find(q=>q.id===id);if(!q)return'';return`<div class="wrong-item"><div><span class="question-tag ${q.tagClass}">${q.catLabel}</span><h3>${q.title}</h3></div><div class="wrong-actions"><button class="btn btn-outline btn-sm" onclick="toggleReview(${q.id})">🔄重做</button></div><div class="review-block" id="review-${q.id}" style="display:none"></div></div>`}).join('')}
    function toggleReview(id){const a=document.getElementById('review-'+id);if(a.style.display==='none'){const q=questions.find(q=>q.id===id);if(q.type==='choice')a.innerHTML=q.options.map((o,i)=>`<div class="option-inline" onclick="retryChoice(${id},${i})">${String.fromCharCode(65+i)}. ${o.text}</div>`).join('');else a.innerHTML=`<textarea id="retryEssay-${id}" class="essay-input" placeholder="重新输入..."></textarea><button class="btn btn-primary btn-sm" onclick="retryEssaySubmit(${id})">提交答案</button><div id="retryFeedback-${id}" style="margin-top:12px"></div>`;a.style.display='block'}else a.style.display='none'}
    function retryChoice(qId,i){const q=questions.find(q=>q.id===qId);if(q.options[i].correct){removeWrong(qId);solvedMap[String(qId)]='correct';solvedMap=Object.assign({},solvedMap);saveUserData();renderWrongBook();updateHome();showToast('已移出错题本！')}else showToast('再试试')}
    function retryEssaySubmit(qId){const q=questions.find(q=>q.id===qId);document.getElementById('retryFeedback-'+qId).innerHTML=`<div style="margin-top:8px">${q.answers.map((a,i)=>`<div class="answer-block">📝(${String.fromCharCode(97+i)})${a}</div>`).join('')}<div style="margin-top:8px;display:flex;gap:8px"><button class="btn btn-success btn-sm" onclick="markRetryCorrect(${qId})">✅答对了</button><button class="btn btn-danger btn-sm" onclick="markRetryWrong(${qId})">❌答错了</button></div></div>`}
    function markRetryCorrect(qId){removeWrong(qId);solvedMap[String(qId)]='correct';solvedMap=Object.assign({},solvedMap);saveUserData();renderWrongBook();updateHome();showToast('已移出错题本！')}
    function markRetryWrong(qId){showToast('继续复习')}
    function clearWrongBook(){if(confirm('清空所有错题？')){wrongIds=[];saveUserData();updateBadge();renderWrongBook();updateHome()}}
    function resetAllProgress(){if(confirm('重置所有进度？')){solvedMap={};wrongIds=[];questions.forEach(q=>{delete q._userInput;delete q._selectedIdx});saveUserData();updateHome();renderQuiz();showToast('已重置')}}
    async function init(){const{data}=await sb.auth.getSession();if(data.session){currentUser=data.session.user;onLoginSuccess()}}
    document.addEventListener('DOMContentLoaded',init);
</script>
